name: CEHLidarScanner
options:
  bundleIdPrefix: ru.cehcrm
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1"
targets:
  CEHLidarScanner:
    type: application
    platform: iOS
    sources:
      - Sources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ru.cehcrm.lidar
        PRODUCT_NAME: CEH CRM
        PRODUCT_MODULE_NAME: CEHCRM
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "2"
        CODE_SIGN_STYLE: Automatic
        INFOPLIST_KEY_CFBundleDisplayName: CEH CRM
        INFOPLIST_KEY_NSCameraUsageDescription: Камера и LiDAR используются для построения контура стены и поиска розеток, вырезов и выводов проводов.
        INFOPLIST_KEY_NSMicrophoneUsageDescription: Микрофон используется для диктовки заметок замера по вашему запросу.
    info:
      path: Sources/Info.plist
      properties:
        CFBundleURLTypes:
          - CFBundleTypeRole: Editor
            CFBundleURLName: ru.cehcrm.lidar
            CFBundleURLSchemes:
              - cehcrm-lidar
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
  CEHLidarScannerTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - Tests
    dependencies:
      - target: CEHLidarScanner
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: ru.cehcrm.lidar.tests
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/CEH CRM.app/CEH CRM"
        BUNDLE_LOADER: "$(TEST_HOST)"
schemes:
  CEHLidarScanner:
    build:
      targets:
        CEHLidarScanner: all
    test:
      targets:
        - CEHLidarScannerTests
