name: CEHLidarScanner
options:
  bundleIdPrefix: ru.cehcrm
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1"
targets:
  CEHLidarScanner:
    type: application
    platform: iOS
    sources:
      - Sources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ru.cehcrm.lidar
        PRODUCT_NAME: CEH LiDAR
        INFOPLIST_KEY_CFBundleDisplayName: CEH LiDAR
        INFOPLIST_KEY_NSCameraUsageDescription: Камера и LiDAR используются для построения контура стены и поиска розеток, вырезов и выводов проводов.
        INFOPLIST_KEY_NSLocalNetworkUsageDescription: Доступ нужен для отправки результата в CRM во время локальной разработки.
    info:
      path: Sources/Info.plist
      properties:
        CFBundleURLTypes:
          - CFBundleTypeRole: Editor
            CFBundleURLName: ru.cehcrm.lidar
            CFBundleURLSchemes:
              - cehcrm-lidar
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UIRequiredDeviceCapabilities:
          - arkit
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait

