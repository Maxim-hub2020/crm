name: Deploy CRM to TimeWeb

on:
  push:
    branches:
      - codex/timeweb-production
  workflow_dispatch:

concurrency:
  group: timeweb-production
  cancel-in-progress: true

permissions:
  contents: read

env:
  DEPLOY_BRANCH: codex/timeweb-production
  TIMEWEB_APP_DIR: ${{ secrets.TIMEWEB_APP_DIR || '/opt/crm' }}
  DEPLOY_TARGET: TimeWeb self-hosted runner

jobs:
  deploy:
    name: Deploy production
    runs-on: self-hosted
    timeout-minutes: 45

    steps:
      - name: Deploy on TimeWeb
        run: |
          set -euo pipefail
          set +e
          {
            cd "$TIMEWEB_APP_DIR"

            if [ ! -f ".env" ]; then
              echo "Missing .env on TimeWeb server: $TIMEWEB_APP_DIR/.env"
              exit 1
            fi

            git config --global --add safe.directory "$TIMEWEB_APP_DIR"
            git fetch origin "$DEPLOY_BRANCH"
            if git show-ref --verify --quiet "refs/heads/$DEPLOY_BRANCH"; then
              git checkout "$DEPLOY_BRANCH"
            else
              git checkout -b "$DEPLOY_BRANCH" "origin/$DEPLOY_BRANCH"
            fi
            git pull --ff-only origin "$DEPLOY_BRANCH"

            docker compose --env-file .env -f docker-compose.prod.yml up -d --build
            docker compose --env-file .env -f docker-compose.prod.yml ps
            docker compose --env-file .env -f docker-compose.prod.yml exec -T backend python manage.py check
          } 2>&1 | tee deploy-output.log
          deploy_status=${PIPESTATUS[0]}
          set -e

          {
            echo "### Deploy output"
            echo '```text'
            tail -n 120 deploy-output.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          exit "$deploy_status"

      - name: Notify Telegram success
        if: success()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          set -euo pipefail
          if [ -z "${TELEGRAM_BOT_TOKEN:-}" ] || [ -z "${TELEGRAM_CHAT_ID:-}" ]; then
            echo "Telegram secrets are not configured, skipping notification."
            exit 0
          fi

          short_sha="${GITHUB_SHA:0:7}"
          run_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          message="<b>CRM deploy completed</b>
          Branch: ${GITHUB_REF_NAME}
          Commit: ${short_sha}
          Server: ${DEPLOY_TARGET}
          Run: ${run_url}"

          curl -fsS -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d "chat_id=${TELEGRAM_CHAT_ID}" \
            -d "parse_mode=HTML" \
            --data-urlencode "text=${message}"

      - name: Notify Telegram failure
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          set -euo pipefail
          if [ -z "${TELEGRAM_BOT_TOKEN:-}" ] || [ -z "${TELEGRAM_CHAT_ID:-}" ]; then
            echo "Telegram secrets are not configured, skipping notification."
            exit 0
          fi

          short_sha="${GITHUB_SHA:0:7}"
          run_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          deploy_tail=""
          if [ -f deploy-output.log ]; then
            deploy_tail="$(tail -n 80 deploy-output.log | tail -c 2800)"
          fi

          message="CRM deploy failed
          Branch: ${GITHUB_REF_NAME}
          Commit: ${short_sha}
          Server: ${DEPLOY_TARGET}
          Run: ${run_url}

          Last deploy output:
          ${deploy_tail}"

          curl -fsS -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d "chat_id=${TELEGRAM_CHAT_ID}" \
            --data-urlencode "text=${message}"
